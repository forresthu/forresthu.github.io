<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="{{ site.author.name }}">
{% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="{{ site.favicon }}">
<link rel="apple-touch-icon" href="/public/upload/gavatar/apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/pages/atom.xml">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }} (English)" href="/feed-en.xml">
<script>
  /* 尽早应用主题，避免闪烁 */
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="/public/css/main.css">
{% if page.usemathjax %}
<script>
  window.MathJax = { tex: { tags: 'ams' }, options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] } };
</script>
{% endif %}
