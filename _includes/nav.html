<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/">
      <img class="brand__avatar" src="{{ site.gavatar }}" alt="" width="32" height="32">
      <span class="brand__name">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="/" {% if page.url == '/' or paginator.page %}aria-current="page"{% endif %}>首页</a>
      <a href="/pages/categories.html" {% if page.path == 'pages/categories.html' %}aria-current="page"{% endif %}>分类</a>
      <a href="/pages/tags.html" {% if page.path == 'pages/tags.html' %}aria-current="page"{% endif %}>标签</a>
      <a href="/pages/archive.html" {% if page.path == 'pages/archive.html' %}aria-current="page"{% endif %}>归档</a>
      <a href="/pages/about.html" {% if page.path == 'pages/about.html' %}aria-current="page"{% endif %}>关于</a>
    </nav>
    <div class="site-actions">
      <form class="search" method="get" action="https://www.google.com/search" target="_blank" role="search">
        <input type="hidden" name="sitesearch" value="{{ site.url }}">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" name="q" placeholder="搜索" aria-label="站内搜索">
      </form>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深色/浅色模式">
        <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>
