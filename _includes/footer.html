<footer class="site-footer">
  <div class="site-footer__inner">
    <span>© {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
    <span class="site-footer__links">
      <a href="/pages/atom.xml" aria-label="RSS">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>RSS
      </a>
      {% if site.author.github %}
      <a href="{{ site.author.github }}" aria-label="GitHub">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>GitHub
      </a>
      {% endif %}
    </span>
  </div>
</footer>
<button class="icon-btn to-top" id="to-top" type="button" aria-label="回到顶部">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
<script src="/public/js/main.js" defer></script>
