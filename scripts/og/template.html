<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    background: #fbfaf7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #1d232b;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 14px;
    background: #0b7d6d;
  }
  .kicker {
    font-size: 26px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: #0b7d6d;
  }
  h1 {
    font-size: 76px; line-height: 1.16; letter-spacing: -0.025em;
    font-weight: 700; max-width: 17ch;
  }
  h1.long { font-size: 60px; max-width: 20ch; }
  .sub {
    margin-top: 28px; font-size: 30px; line-height: 1.5;
    color: #3a434e; max-width: 30ch;
  }
  footer { display: flex; align-items: center; gap: 18px; font-size: 26px; color: #66717d; }
  footer img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
  footer b { color: #1d232b; font-weight: 600; }
  .dot { color: #c9c3b6; }
</style>
</head>
<body>
  <div class="kicker" id="kicker"></div>
  <div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <footer>
    <img src="/public/upload/gavatar/avatar.jpg" alt="">
    <b>Forrest Hu</b><span class="dot">·</span><span>forresthu.github.io</span>
  </footer>
<script>
  var q = new URLSearchParams(location.search);
  var title = q.get('title') || '';
  var t = document.getElementById('title');
  t.textContent = title;
  /* 标题长时自动缩小一档（CJK 字符按两个字宽算） */
  var width = 0;
  for (var i = 0; i < title.length; i++) width += title.charCodeAt(i) > 0x2e80 ? 2 : 1;
  if (width > 46) t.className = 'long';
  document.getElementById('sub').textContent = q.get('sub') || '';
  document.getElementById('kicker').textContent = q.get('kicker') || '';
</script>
</body>
</html>
